[project]
name = "mobility-stats"
version = "0.1.0"
description = "Small teaching library for analysing bike-sharing rides"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # modern Python syntax
    "E",   # pycodestyle errors
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
